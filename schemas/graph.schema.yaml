$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://amca.local/schemas/graph.schema.yaml"
title: "AMCA Normalized Candidate Graph"
type: object
additionalProperties: false
required: [graph_version, machine_id, nodes, edges, specification_sha256, candidate_sha256, registry_profile]
properties:
  graph_version:
    const: "1.0"
  machine_id:
    type: string
    pattern: "^[a-z][a-z0-9_-]{0,63}$"
  nodes:
    type: array
    minItems: 1
    maxItems: 64
    items:
      type: object
      additionalProperties: false
      required: [id, component, config]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        component:
          enum: [input_source, validate_text, analysis_a, analysis_b, aggregate_results, generate_report]
        config:
          type: object
  edges:
    type: array
    maxItems: 128
    items:
      type: object
      additionalProperties: false
      required: [from, out, to, in]
      properties:
        from: {type: string}
        out: {type: string}
        to: {type: string}
        in: {type: string}
  specification_sha256:
    $ref: "#/$defs/sha256"
  candidate_sha256:
    $ref: "#/$defs/sha256"
  registry_profile:
    type: string
    minLength: 1
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
