$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://amca.local/schemas/verification-report.schema.yaml"
title: "AMCA Verification Report"
type: object
additionalProperties: false
required: [report_version, status, candidate_sha256, profile_id, checks, reasons, assumptions]
properties:
  report_version:
    const: "1.0"
  status:
    enum: [verified, rejected, inconclusive]
  candidate_sha256:
    $ref: "#/$defs/sha256"
  profile_id:
    type: string
    minLength: 1
  checks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, status, details]
      properties:
        id:
          type: string
          minLength: 1
        status:
          enum: [passed, failed, inconclusive]
        details:
          type: object
  reasons:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        node_id:
          type: string
        edge:
          type: object
          additionalProperties: false
          required: [from, out, to, in]
          properties:
            from: {type: string}
            out: {type: string}
            to: {type: string}
            in: {type: string}
  assumptions:
    type: array
    items: {type: string}
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
